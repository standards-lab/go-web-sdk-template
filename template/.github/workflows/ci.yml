name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.1

      - name: mise run check
        run: mise run check

  # The integration tier: the composed service as the binary, black-box,
  # through its API. On merge to main and on demand, below the per-PR unit
  # rate by design; a release is cut only from a main whose run has passed.
  # A service with a backing service runs this against its compose stack as
  # an isolated project, the way the reference service does.
  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27"

      - name: go test -tags integration
        run: go test -race -count=1 -tags integration ./integration/

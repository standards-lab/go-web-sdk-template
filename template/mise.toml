[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
jq = "1.8.2"

[env]
APP_ENV = "local"
# The service's Go modules, as directories; tasks run in each one.
GO_MODULES = "."

# check vets, fixes, and lints with the integration tag so the integration
# suite compiles and lints too; it runs only the unit tier.
[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet -tags integration ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -tags integration -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run --build-tags integration ./...
done
'''

# currency runs through bash: gonew does not keep the script's executable bit.
[tasks.currency]
description = "Report every requirement, Go version, tool, and action pin behind its latest; writes nothing"
run = "bash scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive and direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
# The go directive follows the current Go minor, with no toolchain line.
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --local
'''

[tasks.build]
description = "Build the module"
run = "go build ./..."

[tasks.vet]
description = "Run go vet, the integration suite included"
run = "go vet -tags integration ./..."

[tasks.serve]
description = "Run the service locally"
run = "go run ./cmd/server"

[tasks.test]
description = "Run the unit tier"
run = "go test -race ./..."

# The integration tier runs the built service as a subprocess. A service with a
# backing service wraps this in its compose stack as an isolated project, the way
# the reference service does; the template is engine-free and needs none.
[tasks.integration]
description = "Run the integration tier against the built service"
run = "go test -race -count=1 -tags integration ./integration/"

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy"
run = "go mod tidy"

[tasks.lint]
description = "Run golangci-lint, the integration suite included"
run = "golangci-lint run --build-tags integration ./..."

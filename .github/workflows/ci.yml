# CI: the check on every push and pull request, and the integration tier on push to main and on
# demand.
# See architecture/standards/go-elemental/principles/release-and-ci.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: template

      - name: mise run check
        run: mise -C template run check

  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.10
        with:
          working_directory: template

      - name: go test -tags integration
        working-directory: template
        run: go test -race -count=1 -tags integration ./integration/

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: template/go.sum

      - name: go vet
        working-directory: template
        run: go vet -tags integration ./...

      - name: gofmt
        working-directory: template
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "$unformatted"; exit 1; }

      - name: go mod tidy -diff
        working-directory: template
        run: go mod tidy -diff

      - name: go test -race
        working-directory: template
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: template
          args: --build-tags integration

  # The integration tier: the composed service as the binary, black-box,
  # through its API. On merge to main and on demand, below the per-PR unit
  # rate by design; a release is cut only from a main whose run has passed.
  # A service with a backing service runs this against its compose stack as
  # an isolated project, the way the reference service does.
  integration:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: template/go.sum

      - name: go test -tags integration
        working-directory: template
        run: go test -race -count=1 -tags integration ./integration/

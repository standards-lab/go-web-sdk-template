name: Release

on:
  push:
    tags:
      - "template/v*"

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1.11.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: CHANGELOG.md
          prefix: "template/"
